<!DOCTYPE html>
<html>
<head>
    <title>StatScout Intelligence</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/light.css">
    <style>
        body { max-width: 800px; margin: 40px auto; padding: 20px; }
        pre { white-space: pre-wrap; background: #f4f4f4; padding: 15px; border-left: 5px solid #007bff; }
        .loader { display: none; color: #007bff; font-weight: bold; }
    </style>
</head>
<body>
    <h1>📊 StatScout</h1>
    <p>Academic Dataset Intelligence Agent</p>
    
    <form id="queryForm">
        <input type="text" id="queryInput" placeholder="Ask about demographics, sales, or traffic..." required>
        <button type="submit">Analyze</button>
    </form>

    <div id="loader" class="loader">Querying BigQuery...</div>
    <div id="result"></div>

    <script>
        document.getElementById('queryForm').onsubmit = async (e) => {
            e.preventDefault();
            const query = document.getElementById('queryInput').value;
            const loader = document.getElementById('loader');
            const resultDiv = document.getElementById('result');
            
            loader.style.display = 'block';
            resultDiv.innerHTML = '';

            const response = await fetch('/analyze', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({query})
            });
            
            const data = await response.json();
            loader.style.display = 'none';
            
            if (response.ok) {
                resultDiv.innerHTML = `<h3>Report</h3><pre>${data.report}</pre>`;
            } else {
                resultDiv.innerHTML = `<p style="color:red">Error: ${data.detail}</p>`;
            }
        };
    </script>
</body>
</html>
